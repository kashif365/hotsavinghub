```yaml
deployment:
  tasks:
    - export APPPATH="/home2/socialof/hotsavinghub_public/HotSavingHub"
    - export PUBLICPATH="/home2/socialof/hotsavinghub_public"
    - export PATH="/opt/alt/alt-nodejs20/root/usr/bin:$PATH"

    # Deploy Laravel application files
    - /bin/cp -R app "$APPPATH/"
    - /bin/cp -R bootstrap "$APPPATH/"
    - /bin/cp -R config "$APPPATH/"
    - /bin/cp -R database "$APPPATH/"
    - /bin/cp -R resources "$APPPATH/"
    - /bin/cp -R routes "$APPPATH/"
    - /bin/cp -R storage "$APPPATH/"
    - /bin/cp -R tests "$APPPATH/"
    - /bin/cp artisan "$APPPATH/"
    - /bin/cp composer.json "$APPPATH/"
    - /bin/cp composer.lock "$APPPATH/"
    - /bin/cp package.json "$APPPATH/"
    - /bin/cp package-lock.json "$APPPATH/"
    - /bin/cp vite.config.js "$APPPATH/"

    # Remove old Laravel package caches BEFORE Composer
    - cd "$APPPATH" && rm -f bootstrap/cache/packages.php
    - cd "$APPPATH" && rm -f bootstrap/cache/services.php

    # Install PHP dependencies without running Laravel scripts
    - cd "$APPPATH" && /opt/cpguard/app/resources/tools/composer install --no-dev --optimize-autoloader --no-scripts

    # Remove package caches again after Composer
    - cd "$APPPATH" && rm -f bootstrap/cache/packages.php
    - cd "$APPPATH" && rm -f bootstrap/cache/services.php

    # Rebuild Laravel package discovery
    - cd "$APPPATH" && php artisan package:discover --ansi

    # Install frontend dependencies
    - cd "$APPPATH" && npm ci --include=optional

    # Build Vite production assets
    - cd "$APPPATH" && npm run build

    # Run database migrations
    - cd "$APPPATH" && php artisan migrate --force

    # Ensure storage symlink exists
    - cd "$APPPATH" && php artisan storage:link || true

    # Clear Laravel caches
    - cd "$APPPATH" && php artisan optimize:clear

    # Rebuild Laravel caches
    - cd "$APPPATH" && php artisan optimize

    # Deploy public directory including hidden files
    - /bin/cp -R public/. "$PUBLICPATH/"
```
